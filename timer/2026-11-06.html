<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>発車タイマー 11/6（青）</title>
<style>
:root{--bg:#f4f4f6;--surface:#ffffff;--muted-bg:#ececf0;--text:#1c1c1e;--muted:#6b6b70;--border:#d8d8de;--accent:#0a6cff;--on-accent:#ffffff;--soon:#d7263d}
@media (prefers-color-scheme: dark){:root{--bg:#101012;--surface:#1e1e22;--muted-bg:#2a2a30;--text:#f2f2f5;--muted:#a1a1a8;--border:#3a3a42;--accent:#3d8bff;--on-accent:#ffffff;--soon:#ff4d5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;padding:14px}
.dt{max-width:560px;margin:0 auto}
.dt-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dt-title{font-weight:700;font-size:15px}
.dt-clock{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.dt-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:4px}
.dt-bar button{padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;cursor:pointer}
.dt-note{font-size:12px;color:var(--muted);text-align:right;min-height:16px;margin-bottom:6px}
.dt-next{border:2px solid var(--accent);border-radius:16px;padding:14px 16px;background:var(--surface)}
.dt-next .lab{font-size:13px;color:var(--muted)}
.dt-next .stop{font-size:26px;font-weight:800;line-height:1.2}
.dt-next .row{display:flex;justify-content:space-between;align-items:baseline}
.dt-next .time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.dt-next .cd{font-size:52px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.dt-next.soon{background:var(--soon);border-color:var(--soon);color:#fff}
.dt-next.soon .lab{color:#fff}
.dt-sticky{position:sticky;top:0;background:var(--bg);padding:6px 0 2px;z-index:5}
.dt-after{margin:8px 2px 6px;font-size:14px;color:var(--muted)}
.dt-list{border-top:1px solid var(--border)}
.dt-ev{display:flex;gap:10px;padding:7px 4px;border-bottom:1px solid var(--border);font-size:15px;align-items:baseline}
.dt-ev .t{font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}
.dt-ev .s{flex:1}
.dt-ev .r{color:var(--muted);font-size:12px}
.dt-ev.past{opacity:.38}
.dt-ev.next{background:var(--muted-bg);border-radius:8px}
.dt-ev .arr{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="dt">
  <div class="dt-head"><div class="dt-title">発車タイマー（11/6・青）</div><div class="dt-clock">現在 <span id="clock">--:--:--</span></div></div>
  <div class="dt-bar"><button id="lockBtn">画面ロック防止オフ</button><button id="soundBtn">音オフ</button></div>
  <div class="dt-note" id="lockNote"></div>
  <div class="dt-sticky">
    <div class="dt-next" id="nextBox"><div class="lab">次の発車</div><div class="stop">読み込み中</div></div>
    <div class="dt-after" id="afterBox"></div>
  </div>
  <div class="dt-list" id="list"></div>
</div>
<script>
var STOPS=["BY","セントラル広場南","テレコムセンター","ヒルトン東京お台場","台場公園","アクアシティお台場"];
var EV=[
{run:"① 午前便",stop:0,t:"12:10"},{run:"① 午前便",stop:1,t:"12:31"},{run:"① 午前便",stop:2,t:"12:41"},{run:"① 午前便",stop:3,t:"12:48"},{run:"① 午前便",stop:4,t:"13:08"},{run:"① 午前便",stop:5,t:"13:15"},
{run:"戻り",stop:1,t:"13:22"},{run:"戻り",stop:2,t:"13:27",arr:1},
{run:"② 午後便",stop:0,t:"14:20"},{run:"② 午後便",stop:2,t:"14:41"},{run:"② 午後便",stop:3,t:"14:48"},{run:"② 午後便",stop:4,t:"15:06"},{run:"② 午後便",stop:5,t:"15:13"},
{run:"③ 午後便",stop:1,t:"15:20"},{run:"③ 午後便",stop:2,t:"15:46"},{run:"③ 午後便",stop:3,t:"15:53"},{run:"③ 午後便",stop:4,t:"16:06"},{run:"③ 午後便",stop:5,t:"16:13"},
{run:"③ 午後便2",stop:1,t:"16:20"},{run:"③ 午後便2",stop:2,t:"16:46"},{run:"③ 午後便2",stop:3,t:"16:53"},{run:"③ 午後便2",stop:4,t:"17:06"},{run:"③ 午後便2",stop:5,t:"17:13"},
{run:"戻り",stop:1,t:"17:20"},{run:"戻り",stop:2,t:"17:25",arr:1}
];
var state={sound:false};
var actx=null,beeped={};
var lockOn=false,wakeLock=null;
function applyLock(){
  if(!lockOn)return;
  if(!("wakeLock" in navigator)){document.getElementById("lockNote").textContent="この端末・ブラウザはロック防止に未対応です";lockOn=false;render();return;}
  navigator.wakeLock.request("screen").then(function(wl){
    wakeLock=wl;
    document.getElementById("lockNote").textContent="画面はついたままになります（電池の減りは早くなります）";
    wl.addEventListener("release",function(){wakeLock=null;if(lockOn&&!document.hidden){setTimeout(applyLock,300);}});
  }).catch(function(){document.getElementById("lockNote").textContent="ロック防止を開始できませんでした。もう一度押してみてください";});
}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&lockOn&&!wakeLock)applyLock();});
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function beepSeq(notes){if(!state.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.resume)actx.resume();var t0=actx.currentTime+0.05;notes.forEach(function(n){var o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=n[0];o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(0.12,t0+n[1]);g.gain.exponentialRampToValueAtTime(0.001,t0+n[1]+n[2]);o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+0.02);});}catch(e){}}
function beepWarn(){beepSeq([[1046,0,0.15],[1046,0.28,0.15]]);vib([120,80,120]);}
function beepGo(){beepSeq([[784,0,0.15],[988,0.2,0.15],[1175,0.4,0.15],[1568,0.6,0.55]]);vib([200,100,200,100,400]);}
function toSec(t){var p=t.split(":");return (+p[0])*3600+(+p[1])*60;}
function fmt(s){if(s<0)s=0;var h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;function z(x){return (x<10?"0":"")+x;}return h>0?h+":"+z(m)+":"+z(ss):z(m)+":"+z(ss);}
function render(){
  var now=new Date();var ns=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  document.getElementById("clock").textContent=fmt(ns);
  document.getElementById("soundBtn").textContent=state.sound?"音オン":"音オフ";
  document.getElementById("lockBtn").textContent=lockOn?"画面ロック防止オン":"画面ロック防止オフ";
  var ni=-1;
  for(var i=0;i<EV.length;i++){if(toSec(EV[i].t)>ns){ni=i;break;}}
  var nb=document.getElementById("nextBox"),ab=document.getElementById("afterBox");
  if(ni<0){nb.classList.remove("soon");nb.innerHTML="<div class='lab'>次の発車</div><div class='stop'>本日の運行は終了</div>";ab.textContent="";}
  else{
    var e=EV[ni],d=toSec(e.t)-ns;
    nb.classList.toggle("soon",d<=60);
    nb.innerHTML="<div class='lab'>"+(e.arr?"次の到着":"次の発車")+"（"+e.run+"）</div><div class='row'><div><div class='stop'>"+STOPS[e.stop]+"</div><div class='time'>"+e.t+(e.arr?" 着":" 発")+"</div></div><div class='cd'>"+fmt(d)+"</div></div>";
    var key=e.t+e.stop;
    if(state.sound&&d<=60&&d>55&&!beeped[key+"m"]){beeped[key+"m"]=1;beepWarn();}
    if(state.sound&&d<=2&&!beeped[key+"z"]){beeped[key+"z"]=1;beepGo();}
    var nx=EV[ni+1];
    ab.textContent=nx?("その次： "+nx.t+" "+STOPS[nx.stop]+(nx.arr?" 着":" 発")+"（"+nx.run+"）"):"";
  }
  var html="";
  EV.forEach(function(e,i){
    var cls=(toSec(e.t)<=ns)?"past":(i===ni?"next":"");
    html+="<div class='dt-ev "+cls+"'><div class='t'>"+e.t+"</div><div class='s'>"+STOPS[e.stop]+(e.arr?" <span class='arr'>到着</span>":"")+"</div><div class='r'>"+e.run+"</div></div>";
  });
  document.getElementById("list").innerHTML=html;
}
document.getElementById("soundBtn").addEventListener("click",function(){state.sound=!state.sound;if(state.sound)beepGo();render();});
document.getElementById("lockBtn").addEventListener("click",function(){
  lockOn=!lockOn;
  if(lockOn){applyLock();}
  else{if(wakeLock){wakeLock.release();wakeLock=null;}document.getElementById("lockNote").textContent="";}
  render();
});
render();setInterval(render,500);
</script>
</body>
</html>
