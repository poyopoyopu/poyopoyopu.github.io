  <div id="__bundler_placeholder">Loading 世界のお酒フェス 一緒に行こうぜ...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

%; background: #0A0A0C; color: #F3EDE2; font-family: 'Zen Kaku Gothic New', system-ui, sans-serif; overflow: hidden\" data-canvas-width=\"1280\" data-canvas-height=\"7800\" data-document-role=\"page\" data-label=\"招待LP\">\n\n<!-- ============ HERO ============ -->\n<header class=\"wdf-dots\" sc-camel-on-pointer-move=\"{{onMove}}\" style=\"position: relative; border-bottom: 1px solid #1F1F27\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: 20px clamp(18px, 4vw, 48px); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<p style=\"margin: 0; display: flex; align-items: center; gap: 10px; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.2em\"><span class=\"wdf-blink\" style=\"display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #FFB000\"><\u002Fspan>WDF / ODAIBA TERMINAL<\u002Fp>\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #9A9AA6\">非公式・職場有志のおさそい<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(16px, 4vw, 48px) clamp(18px, 4vw, 48px) clamp(48px, 7vw, 88px); display: flex; flex-direction: column; gap: clamp(32px, 4vw, 56px)\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: clamp(24px, 4vw, 56px)\">\n<div style=\"flex: 999 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<p class=\"wdf-reveal\" style=\"margin: 0; display: inline-flex; align-self: flex-start; background: #FFB000; color: #0A0A0C; padding: 8px 16px; border-radius: 6px; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.14em\">11.22 SUN — AFTER WORK<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: clamp(54px, 10vw, 148px); line-height: 1; letter-spacing: -0.02em\"><span class=\"wdf-reveal\" style=\"display: block; transition-delay: 120ms\">世界を、<\u002Fspan><span class=\"wdf-reveal\" style=\"display: block; color: #FFB000; transition-delay: 260ms\">飲み歩こう。<\u002Fspan><\u002Fh1>\n<p class=\"wdf-reveal wdf-outline\" style=\"margin: 0; font-family: 'Anton', sans-serif; font-size: clamp(24px, 3.6vw, 48px); line-height: 1.05; letter-spacing: 0.02em; transition-delay: 400ms\">AFTER WORK, AROUND THE WORLD.<\u002Fp>\n<p class=\"wdf-reveal\" style=\"margin: 0; max-width: 580px; font-size: clamp(15px, 1.5vw, 18px); line-height: 1.9; color: #C8C8D0; transition-delay: 520ms\">テレポートから歩いて5分。お台場に、世界のお酒とメシが集まる4日間。<br>11月22日の仕事終わり、職場のみんなでちょっと海外まで飲みに行こう。<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"wdf-reveal\" style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; transition-delay: 200ms\">\n<div style=\"position: relative; width: clamp(260px, 30vw, 400px); height: clamp(320px, 37vw, 490px)\">\n<canvas ref=\"{{glassRef}}\" sc-camel-on-click=\"{{splash}}\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer\" role=\"img\" aria-label=\"グラスの中で揺れるお酒\"><\u002Fcanvas>\n<div style=\"position: absolute; top: -6px; right: -10px; width: clamp(110px, 11vw, 150px); height: clamp(110px, 11vw, 150px)\">\n<svg class=\"wdf-spin\" sc-camel-view-box=\"0 0 200 200\" style=\"position: absolute; inset: 0; width: 100%; height: 100%\" role=\"img\" aria-label=\"入場無料\">\n<defs><path id=\"wdfCircle\" d=\"M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0\"><\u002Fpath><\u002Fdefs>\n<circle cx=\"100\" cy=\"100\" r=\"97\" fill=\"#0A0A0C\" stroke=\"#FFB000\" stroke-width=\"3\"><\u002Fcircle>\n<text style=\"font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 3px\" fill=\"#FFB000\"><textPath href=\"#wdfCircle\">ENTRY FREE · 入場無料 · ENTRY FREE · 入場無料 · <\u002FtextPath><\u002Ftext>\n<\u002Fsvg>\n<div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center\">\n<p style=\"margin: 0; font-family: 'Anton', sans-serif; font-size: clamp(32px, 3.4vw, 44px); line-height: 1\">¥0<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{enableTilt}}\" class=\"wdf-btn\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 18px; border: 1px solid #3A3A44; border-radius: 999px; background: #141418; color: #F3EDE2; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFB000\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"7\" y=\"2\" width=\"10\" height=\"20\" rx=\"2\"><\u002Frect><path d=\"M3 8c-1 2-1 6 0 8\"><\u002Fpath><path d=\"M21 8c1 2 1 6 0 8\"><\u002Fpath><\u002Fsvg>\n{{tiltLabel}}<\u002Fbutton>\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #8A8A96\">TAP THE GLASS TO SPLASH<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- DEPARTURE BOARD -->\n<div class=\"wdf-reveal\" style=\"background: #111115; border: 1px solid #26262E; border-radius: 20px; padding: clamp(14px, 2.4vw, 28px); display: flex; flex-direction: column; gap: 16px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px\">\n<p style=\"margin: 0; display: flex; align-items: baseline; gap: 14px\"><span style=\"font-family: 'Anton', sans-serif; font-size: clamp(26px, 3vw, 38px); letter-spacing: 0.04em; color: #FFB000\">DEPARTURES<\u002Fspan><span style=\"font-family: 'Dela Gothic One', sans-serif; font-size: clamp(16px, 1.8vw, 22px)\">出発便のご案内<\u002Fspan><\u002Fp>\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #9A9AA6\">会場で飲める世界のお酒（一部）<\u002Fp>\n<\u002Fdiv>\n<div style=\"overflow-x: auto\">\n<div style=\"min-width: 680px; display: flex; flex-direction: column\">\n<div style=\"display: grid; grid-template-columns: 96px minmax(0, 1.4fr) minmax(0, 1fr) 150px; gap: 16px; padding: 0 0 10px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #9A9AA6\">\n<span>FLIGHT<\u002Fspan><span>DESTINATION<\u002Fspan><span>お酒<\u002Fspan><span>STATUS<\u002Fspan>\n<\u002Fdiv>\n<sc-for list=\"{{board}}\" as=\"row\" hint-placeholder-count=\"5\">\n<div style=\"display: grid; grid-template-columns: 96px minmax(0, 1.4fr) minmax(0, 1fr) 150px; gap: 16px; align-items: center; padding: 10px 0; border-top: 1px solid #1F1F27\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; color: #FFB000\">{{row.flight}}<\u002Fspan>\n<span style=\"display: flex; gap: 4px\">\n<sc-for list=\"{{row.chars}}\" as=\"c\" hint-placeholder-count=\"7\">\n<span class=\"wdf-cell\" style=\"animation-name: {{c.anim}}; animation-delay: {{c.delay}}\">{{c.ch}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fspan>\n<span style=\"font-size: clamp(16px, 1.7vw, 20px); font-weight: 700\">{{row.ja}}<\u002Fspan>\n<span style=\"font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; color: {{row.statusColor}}\">{{row.status}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ MARQUEE ============ -->\n<div style=\"background: #FFB000; color: #0A0A0C; padding: 16px 0; overflow: hidden\" aria-hidden=\"true\">\n<div class=\"wdf-track\" style=\"display: flex; width: max-content; gap: 40px; font-family: 'Anton', sans-serif; font-size: clamp(24px, 3vw, 38px); letter-spacing: 0.04em; white-space: nowrap\">\n<span>乾杯<\u002Fspan><span>★<\u002Fspan><span>CHEERS<\u002Fspan><span>★<\u002Fspan><span>PROST<\u002Fspan><span>★<\u002Fspan><span>SALUD<\u002Fspan><span>★<\u002Fspan><span>SAÚDE<\u002Fspan><span>★<\u002Fspan><span>EGÉSZSÉGEDRE<\u002Fspan><span>★<\u002Fspan><span>SALUTE<\u002Fspan><span>★<\u002Fspan><span>SANTÉ<\u002Fspan><span>★<\u002Fspan>\n<span>乾杯<\u002Fspan><span>★<\u002Fspan><span>CHEERS<\u002Fspan><span>★<\u002Fspan><span>PROST<\u002Fspan><span>★<\u002Fspan><span>SALUD<\u002Fspan><span>★<\u002Fspan><span>SAÚDE<\u002Fspan><span>★<\u002Fspan><span>EGÉSZSÉGEDRE<\u002Fspan><span>★<\u002Fspan><span>SALUTE<\u002Fspan><span>★<\u002Fspan><span>SANTÉ<\u002Fspan><span>★<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ COUNTDOWN ============ -->\n<section style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 120px) clamp(18px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(28px, 4vw, 56px)\">\n<div class=\"wdf-reveal\" style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #FFB000\">{{countLabel}}<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: clamp(30px, 4vw, 48px); line-height: 1.25\">11/22（日）<br>仕事終わりに、搭乗。<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.9; color: #C8C8D0\">会場は12時から開いてる。俺らはシフトが終わったら合流。ラストオーダーは20:30だから、遅番の人も間に合うように急ごう。<\u002Fp>\n<\u002Fdiv>\n<div class=\"wdf-reveal\" style=\"flex: 2 1 520px; min-width: 0; transition-delay: 150ms\">\n<sc-if value=\"{{showCount}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 1.4vw, 16px)\">\n<sc-for list=\"{{digits}}\" as=\"g\" hint-placeholder-count=\"4\">\n<div style=\"background: #141418; border: 1px solid #26262E; border-radius: 16px; padding: clamp(14px, 2.4vw, 28px) 8px; display: flex; flex-direction: column; align-items: center; gap: 6px\">\n<span style=\"font-family: 'Anton', sans-serif; font-size: clamp(44px, 8vw, 104px); line-height: 1; color: #F3EDE2; font-variant-numeric: tabular-nums\">{{g.v}}<\u002Fspan>\n<span style=\"font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #9A9AA6\">{{g.k}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{showOpen}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; font-family: 'Anton', sans-serif; font-size: clamp(56px, 10vw, 140px); line-height: 1; color: #FFB000\">NOW BOARDING<\u002Fp>\n<\u002Fsc-if>\n<sc-if value=\"{{showClosed}}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; font-family: 'Anton', sans-serif; font-size: clamp(56px, 10vw, 140px); line-height: 1; color: #5B5B66\">LANDED<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ THE BAR (bottles) ============ -->\n<section style=\"border-top: 1px solid #1F1F27; background: #0D0D10\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 120px) clamp(18px, 4vw, 48px); display: flex; flex-direction: column; gap: clamp(32px, 4vw, 56px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px\">\n<div class=\"wdf-reveal\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #FFB000\">01 / THE BAR<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: clamp(34px, 5vw, 64px); line-height: 1.15\">今夜の、<br>ボトル棚。<\u002Fh2>\n<\u002Fdiv>\n<p class=\"wdf-reveal\" style=\"margin: 0; max-width: 380px; font-size: 15px; line-height: 1.9; color: #C8C8D0; transition-delay: 120ms\">居酒屋じゃまず出会えない9本。指でなぞるとボトルが揺れる。スマホは横にスクロールしてね。<\u002Fp>\n<\u002Fdiv>\n<div style=\"overflow-x: auto; padding-top: 24px\">\n<div style=\"display: flex; min-width: 900px\">\n<sc-for list=\"{{shelf}}\" as=\"b\" hint-placeholder-count=\"9\">\n<div class=\"wdf-reveal wdf-bottle-wrap\" style=\"flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: stretch; transition-delay: {{b.delay}}\">\n<div style=\"padding: 0 clamp(6px, 1vw, 14px); display: flex; justify-content: center\">\n<svg sc-camel-view-box=\"0 0 120 240\" style=\"width: 100%; max-width: 104px; height: auto; display: block; overflow: visible\" aria-hidden=\"true\">\n<defs><clipPath id=\"{{b.clipId}}\"><rect x=\"0\" y=\"{{b.level}}\" width=\"120\" height=\"240\"><\u002Frect><\u002FclipPath><\u002Fdefs>\n<path d=\"{{b.body}}\" fill=\"{{b.liquid}}\" fill-opacity=\"0.92\" clip-path=\"{{b.clipUrl}}\"><\u002Fpath>\n<path d=\"{{b.body}}\" fill=\"#F3EDE2\" fill-opacity=\"0.05\" stroke=\"#F3EDE2\" stroke-opacity=\"0.85\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><\u002Fpath>\n<rect x=\"{{b.label.x}}\" y=\"{{b.label.y}}\" width=\"{{b.label.w}}\" height=\"{{b.label.h}}\" rx=\"3\" fill=\"#F3EDE2\"><\u002Frect>\n<rect x=\"{{b.label.x}}\" y=\"{{b.label.y}}\" width=\"{{b.label.w}}\" height=\"7\" rx=\"2\" fill=\"{{b.ink}}\"><\u002Frect>\n<text x=\"60\" y=\"{{b.ty}}\" text-anchor=\"middle\" style=\"font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700\" fill=\"#0A0A0C\">{{b.code}}<\u002Ftext>\n<rect x=\"{{b.cap.x}}\" y=\"{{b.cap.y}}\" width=\"{{b.cap.w}}\" height=\"{{b.cap.h}}\" rx=\"2\" fill=\"{{b.ink}}\"><\u002Frect>\n<path d=\"{{b.shine}}\" fill=\"none\" stroke=\"#FFFFFF\" stroke-opacity=\"0.35\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fpath>\n<\u002Fsvg>\n<\u002Fdiv>\n<div style=\"height: 8px; background: #FFB000; box-shadow: 0 16px 28px -10px rgba(255, 176, 0, 0.55)\"><\u002Fdiv>\n<div style=\"padding: 16px 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #9A9AA6\">{{b.countryJa}}<\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 900\">{{b.ja}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ GACHA ============ -->\n<section style=\"border-top: 1px solid #1F1F27; border-bottom: 1px solid #1F1F27; background: #101014\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 120px) clamp(18px, 4vw, 48px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(32px, 5vw, 72px)\">\n<div class=\"wdf-reveal\" style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #FFB000\">02 / TONIGHT'S PICK<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: clamp(34px, 5vw, 64px); line-height: 1.15\">今夜の一杯、<br>運に任せる。<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.9; color: #C8C8D0\">何から飲むか迷ったら、ここで引いとこう。出たやつが当日最初の一杯。引くとトップのグラスの酒の色も変わる。<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{pull}}\" class=\"wdf-btn\" style=\"align-self: flex-start; display: inline-flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 32px; border: 0; border-radius: 999px; background: #FFB000; color: #0A0A0C; font-family: 'Dela Gothic One', sans-serif; font-size: 20px; cursor: pointer\">\n<svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A0A0C\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 21h8\"><\u002Fpath><path d=\"M12 15v6\"><\u002Fpath><path d=\"M5 3h14l-7 12z\"><\u002Fpath><\u002Fsvg>\n{{pullLabel}}<\u002Fbutton>\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #9A9AA6\">{{pullCount}}<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"wdf-reveal\" style=\"flex: 1 1 440px; min-width: 0; display: flex; justify-content: center; transition-delay: 150ms\">\n<sc-if value=\"{{hasPick}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: relative; width: 100%; max-width: 500px; background: #F3EDE2; color: #0A0A0C; border-radius: 22px; padding: clamp(24px, 3.4vw, 40px); display: flex; gap: 16px; align-items: center; animation: {{cardAnim}} .5s cubic-bezier(.2,1.2,.4,1) both\">\n<div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.16em\">{{pick.code}} · {{pick.countryJa}} · GATE {{pick.gate}}<\u002Fspan>\n<p style=\"margin: 0; font-family: 'Anton', sans-serif; font-size: clamp(44px, 6vw, 76px); line-height: 0.95; letter-spacing: 0.01em; overflow-wrap: anywhere\">{{pick.en}}<\u002Fp>\n<p style=\"margin: 0; font-family: 'Dela Gothic One', sans-serif; font-size: clamp(24px, 3vw, 34px); line-height: 1.2\">{{pick.ja}}<\u002Fp>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.8; color: #33333D\">{{pick.line}}<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 0 0 clamp(80px, 10vw, 118px); position: relative\">\n<svg sc-camel-view-box=\"0 0 120 240\" style=\"width: 100%; height: auto; display: block; overflow: visible\" aria-hidden=\"true\">\n<defs><clipPath id=\"wdfPickClip\"><rect x=\"0\" y=\"{{pb.level}}\" width=\"120\" height=\"240\"><\u002Frect><\u002FclipPath><\u002Fdefs>\n<path d=\"{{pb.body}}\" fill=\"{{pb.liquidDeep}}\" clip-path=\"url(#wdfPickClip)\"><\u002Fpath>\n<path d=\"{{pb.body}}\" fill=\"none\" stroke=\"#0A0A0C\" stroke-width=\"2.4\" stroke-linejoin=\"round\"><\u002Fpath>\n<rect x=\"{{pb.label.x}}\" y=\"{{pb.label.y}}\" width=\"{{pb.label.w}}\" height=\"{{pb.label.h}}\" rx=\"3\" fill=\"#FFFFFF\" stroke=\"#0A0A0C\" stroke-width=\"1.5\"><\u002Frect>\n<rect x=\"{{pb.label.x}}\" y=\"{{pb.label.y}}\" width=\"{{pb.label.w}}\" height=\"7\" rx=\"2\" fill=\"{{pb.ink}}\"><\u002Frect>\n<text x=\"60\" y=\"{{pb.ty}}\" text-anchor=\"middle\" style=\"font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700\" fill=\"#0A0A0C\">{{pb.code}}<\u002Ftext>\n<rect x=\"{{pb.cap.x}}\" y=\"{{pb.cap.y}}\" width=\"{{pb.cap.w}}\" height=\"{{pb.cap.h}}\" rx=\"2\" fill=\"{{pb.ink}}\"><\u002Frect>\n<\u002Fsvg>\n<div style=\"position: absolute; left: -46px; bottom: -18px; width: 104px; height: 104px; border: 3px solid #C8372D; outline: 2px dashed #C8372D; outline-offset: -10px; border-radius: 50%; background: rgba(243, 237, 226, 0.6); color: #C8372D; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; animation: {{stampAnim}} .6s .25s cubic-bezier(.3,1.4,.5,1) both\" aria-hidden=\"true\">\n<span style=\"font-family: 'Anton', sans-serif; font-size: 18px; letter-spacing: 0.06em; line-height: 1\">APPROVED<\u002Fspan>\n<span style=\"font-size: 11px; font-weight: 900; margin-top: 4px\">本日の一杯<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{noPick}}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"width: 100%; max-width: 500px; min-height: 340px; border: 2px dashed #34343E; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px\">\n<span style=\"font-family: 'Anton', sans-serif; font-size: 120px; line-height: 1; color: #2A2A33\">?<\u002Fspan>\n<span style=\"font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #9A9AA6\">PRESS THE BUTTON<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ PASSPORT ============ -->\n<section style=\"background: #F3EDE2; color: #0A0A0C\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 120px) clamp(18px, 4vw, 48px); display: flex; flex-direction: column; gap: clamp(32px, 4vw, 56px)\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px\">\n<div class=\"wdf-reveal\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #C8372D\">03 / PASSPORT<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: clamp(34px, 5vw, 64px); line-height: 1.15\">全部押せたら、<br>世界一周。<\u002Fh2>\n<\u002Fdiv>\n<p class=\"wdf-reveal\" style=\"margin: 0; max-width: 380px; font-size: 15px; line-height: 1.9; color: #3A3A44; transition-delay: 120ms\">今年が初開催。今夜集める入国スタンプはこの9つ。スクロールするとドンと押される。<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 20px\">\n<sc-for list=\"{{stamps}}\" as=\"s\" hint-placeholder-count=\"9\">\n<div style=\"height: 250px; display: flex; align-items: center; justify-content: center\">\n<div class=\"wdf-stamp\" style=\"box-sizing: border-box; width: {{s.w}}px; height: {{s.h}}px; border: 3px solid {{s.ink}}; outline: 2px dashed {{s.ink}}; outline-offset: -11px; border-radius: {{s.radius}}; color: {{s.ink}}; transform: rotate({{s.rot}}deg); transition-delay: {{s.delay}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; padding: 18px\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.18em\">{{s.code}} · {{s.countryJa}}<\u002Fspan>\n<span style=\"font-family: 'Anton', sans-serif; font-size: 30px; line-height: 1; letter-spacing: 0.03em\">{{s.en}}<\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 900\">{{s.ja}}<\u002Fspan>\n<span style=\"font-size: 12px; font-weight: 700; line-height: 1.5; max-width: 150px\">{{s.short}}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOOD ============ -->\n<section style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 120px) clamp(18px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: clamp(32px, 5vw, 72px); align-items: flex-start\">\n<div class=\"wdf-reveal\" style=\"flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #FFB000\">04 / IN-FLIGHT MENU<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: clamp(34px, 5vw, 64px); line-height: 1.15\">つまみも、<br>世界一周。<\u002Fh2>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.9; color: #C8C8D0\">仕事終わりの腹ペコでも大丈夫。肉、チーズ、締めの甘いやつまで揃ってる。<\u002Fp>\n<\u002Fdiv>\n<div class=\"wdf-reveal\" style=\"flex: 2 1 460px; min-width: 0; background: #141418; border: 1px solid #26262E; border-radius: 22px; padding: clamp(22px, 3.4vw, 40px); transition-delay: 150ms\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #F3EDE2; padding-bottom: 14px; margin-bottom: 6px\">\n<span style=\"font-family: 'Anton', sans-serif; font-size: 26px; letter-spacing: 0.06em\">MENU<\u002Fspan>\n<span style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #9A9AA6\">ON BOARD SERVICE<\u002Fspan>\n<\u002Fdiv>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column\">\n<li style=\"display: flex; align-items: baseline; gap: 12px; padding: 16px 0\"><span style=\"font-size: clamp(17px, 1.8vw, 21px); font-weight: 700\">シュバイネハクセ<\u002Fspan><span style=\"flex: 1; border-bottom: 2px dotted #3A3A44; transform: translateY(-4px)\"><\u002Fspan><span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #9A9AA6\">GER 豚すねの塊焼き<\u002Fspan><\u002Fli>\n<li style=\"display: flex; align-items: baseline; gap: 12px; padding: 16px 0\"><span style=\"font-size: clamp(17px, 1.8vw, 21px); font-weight: 700\">ジャークチキン<\u002Fspan><span style=\"flex: 1; border-bottom: 2px dotted #3A3A44; transform: translateY(-4px)\"><\u002Fspan><span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #9A9AA6\">スパイス香るグリル<\u002Fspan><\u002Fli>\n<li style=\"display: flex; align-items: baseline; gap: 12px; padding: 16px 0\"><span style=\"font-size: clamp(17px, 1.8vw, 21px); font-weight: 700\">ケバブ<\u002Fspan><span style=\"flex: 1; border-bottom: 2px dotted #3A3A44; transform: translateY(-4px)\"><\u002Fspan><span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #9A9AA6\">肉ガッツリ枠<\u002Fspan><\u002Fli>\n<li style=\"display: flex; align-items: baseline; gap: 12px; padding: 16px 0\"><span style=\"font-size: clamp(17px, 1.8vw, 21px); font-weight: 700\">ケサディージャ<\u002Fspan><span style=\"flex: 1; border-bottom: 2px dotted #3A3A44; transform: translateY(-4px)\"><\u002Fspan><span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #9A9AA6\">MEX チーズとろける<\u002Fspan><\u002Fli>\n<li style=\"display: flex; align-items: baseline; gap: 12px; padding: 16px 0\"><span style=\"font-size: clamp(17px, 1.8vw, 21px); font-weight: 700\">クニャペ<\u002Fspan><span style=\"flex: 1; border-bottom: 2px dotted #3A3A44; transform: translateY(-4px)\"><\u002Fspan><span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #9A9AA6\">BOL チーズパン<\u002Fspan><\u002Fli>\n<li style=\"display: flex; align-items: baseline; gap: 12px; padding: 16px 0\"><span style=\"font-size: clamp(17px, 1.8vw, 21px); font-weight: 700\">貴腐ワインカヌレ<\u002Fspan><span style=\"flex: 1; border-bottom: 2px dotted #3A3A44; transform: translateY(-4px)\"><\u002Fspan><span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #9A9AA6\">締めの甘いやつ<\u002Fspan><\u002Fli>\n<li style=\"display: flex; align-items: baseline; gap: 12px; padding: 16px 0\"><span style=\"font-size: clamp(17px, 1.8vw, 21px); font-weight: 700\">トレヴィーゾティラミス<\u002Fspan><span style=\"flex: 1; border-bottom: 2px dotted #3A3A44; transform: translateY(-4px)\"><\u002Fspan><span style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #9A9AA6\">ITA デザート<\u002Fspan><\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FUN ============ -->\n<section style=\"border-top: 1px solid #1F1F27\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 120px) clamp(18px, 4vw, 48px); display: flex; flex-direction: column; gap: clamp(28px, 4vw, 48px)\">\n<div class=\"wdf-reveal\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #FFB000\">05 / ENTERTAINMENT<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: clamp(34px, 5vw, 64px); line-height: 1.15\">飲むだけじゃ、<br>終わらない。<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px\">\n<div class=\"wdf-reveal\" style=\"position: relative; overflow: hidden; background: #F3EDE2; color: #0A0A0C; border-radius: 22px; padding: 32px; min-height: 260px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px\">\n<span style=\"position: absolute; top: 4px; right: 20px; font-family: 'Anton', sans-serif; font-size: 120px; line-height: 1; color: #E2DACB\" aria-hidden=\"true\">01<\u002Fspan>\n<p style=\"position: relative; margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.16em\">STAGE<\u002Fp>\n<h3 style=\"position: relative; margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 28px\">世界の音楽とダンス<\u002Fh3>\n<p style=\"position: relative; margin: 0; font-size: 15px; line-height: 1.8; color: #3A3A44\">ワールドミュージックとダンスのステージ。ものまね芸人のみっちー、Gたかしも登場予定（出演日は公式で）。<\u002Fp>\n<\u002Fdiv>\n<div class=\"wdf-reveal\" style=\"position: relative; overflow: hidden; background: #FFB000; color: #0A0A0C; border-radius: 22px; padding: 32px; min-height: 260px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; transition-delay: 120ms\">\n<span style=\"position: absolute; top: 4px; right: 20px; font-family: 'Anton', sans-serif; font-size: 120px; line-height: 1; color: #E89F00\" aria-hidden=\"true\">02<\u002Fspan>\n<p style=\"position: relative; margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.16em\">BINGO<\u002Fp>\n<h3 style=\"position: relative; margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 28px\">一等は豪華旅行券<\u002Fh3>\n<p style=\"position: relative; margin: 0; font-size: 15px; line-height: 1.8; color: #2A2208\">ビンゴカード付きチケットを買った人限定。お酒の飲み比べセットや家電も当たる。<\u002Fp>\n<\u002Fdiv>\n<div class=\"wdf-reveal\" style=\"position: relative; overflow: hidden; background: #1A1A20; border: 1px solid #2E2E38; border-radius: 22px; padding: 32px; min-height: 260px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; transition-delay: 240ms\">\n<span style=\"position: absolute; top: 4px; right: 20px; font-family: 'Anton', sans-serif; font-size: 120px; line-height: 1; color: #24242C\" aria-hidden=\"true\">03<\u002Fspan>\n<p style=\"position: relative; margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #FFB000\">WORKSHOP<\u002Fp>\n<h3 style=\"position: relative; margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 28px\">作って、試飲して<\u002Fh3>\n<p style=\"position: relative; margin: 0; font-size: 15px; line-height: 1.8; color: #C8C8D0\">オリジナル香水やモザイクガラスのランタン作り、無料試飲会。クイズ大会、カラオケ大会も。<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ BOARDING PASS / INFO ============ -->\n<section class=\"wdf-dots\" style=\"border-top: 1px solid #1F1F27\">\n<div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 120px) clamp(18px, 4vw, 48px); display: flex; flex-direction: column; gap: clamp(28px, 4vw, 48px)\">\n<div class=\"wdf-reveal\" style=\"display: flex; flex-direction: column; gap: 14px\">\n<p style=\"margin: 0; font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #FFB000\">06 / YOUR TICKET<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: clamp(34px, 5vw, 64px); line-height: 1.15\">これが、きみの搭乗券。<\u002Fh2>\n<\u002Fdiv>\n<div class=\"wdf-reveal\" style=\"display: flex; flex-wrap: wrap; background: #F3EDE2; color: #0A0A0C; border-radius: 24px; overflow: hidden\">\n<div style=\"flex: 999 1 560px; min-width: 0; padding: clamp(22px, 3.4vw, 44px); display: flex; flex-direction: column; gap: 28px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n<span style=\"font-family: 'Anton', sans-serif; font-size: 24px; letter-spacing: 0.08em\">BOARDING PASS<\u002Fspan>\n<span style=\"font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #5A5A66\">WDF 1122 / ECONOMY OF FUN<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: clamp(12px, 3vw, 36px); flex-wrap: wrap\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #5A5A66\">FROM<\u002Fspan>\n<span style=\"font-family: 'Anton', sans-serif; font-size: clamp(54px, 7vw, 88px); line-height: 1\">TLP<\u002Fspan>\n<span style=\"font-size: 15px; font-weight: 700\">東京テレポート駅<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex: 1 1 100px; min-width: 100px; display: flex; align-items: center; gap: 10px\">\n<span style=\"flex: 1; border-top: 2px dashed #0A0A0C\"><\u002Fspan>\n<span style=\"font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; white-space: nowrap\">徒歩 約5分<\u002Fspan>\n<span style=\"flex: 1; border-top: 2px dashed #0A0A0C\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #5A5A66\">TO<\u002Fspan>\n<span style=\"font-family: 'Anton', sans-serif; font-size: clamp(54px, 7vw, 88px); line-height: 1\">WLD<\u002Fspan>\n<span style=\"font-size: 15px; font-weight: 700\">セントラル広場<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; border-top: 1px solid #D6CDBE; padding-top: 22px\">\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #5A5A66\">一緒に行く日<\u002Fspan><span style=\"font-size: 19px; font-weight: 900\">11/22（日）<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #5A5A66\">集合<\u002Fspan><span style=\"font-size: 19px; font-weight: 900\">仕事終わり<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #5A5A66\">会場時間<\u002Fspan><span style=\"font-size: 19px; font-weight: 900\">12:00–21:00<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.14em; color: #5A5A66\">LAST ORDER<\u002Fspan><span style=\"font-size: 19px; font-weight: 900; color: #C8372D\">20:30<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 1.8; color: #3A3A44\">\n<span><strong style=\"color: #0A0A0C\">会場<\u002Fstrong>　シンボルプロムナード公園 セントラル広場（江東区青海1丁目1）<\u002Fspan>\n<span><strong style=\"color: #0A0A0C\">アクセス<\u002Fstrong>　りんかい線 東京テレポート駅 徒歩約5分／ゆりかもめ 東京国際クルーズターミナル駅からもすぐ<\u002Fspan>\n<span><strong style=\"color: #0A0A0C\">全日程<\u002Fstrong>　11/20（金）16:00–21:00、11/21（土）〜23（月・祝）12:00–21:00<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; background: #FFB000; padding: clamp(22px, 3.4vw, 44px); border-left: 3px dashed #0A0A0C; display: flex; flex-direction: column; justify-content: space-between; gap: 24px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em\">ADMISSION<\u002Fspan>\n<span style=\"font-family: 'Dela Gothic One', sans-serif; font-size: 44px; line-height: 1.1\">入場無料<\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700\">飲食は会場の食券制<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height: 64px; background-image: repeating-linear-gradient(90deg, #0A0A0C 0 2px, transparent 2px 5px, #0A0A0C 5px 9px, transparent 9px 11px, #0A0A0C 11px 12px, transparent 12px 16px); border-radius: 2px\" aria-hidden=\"true\"><\u002Fdiv>\n<a href=\"https://worlddrinks-fest.jp/\" class=\"wdf-btn\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 22px; background: #0A0A0C; color: #F3EDE2; border-radius: 999px; font-weight: 900; font-size: 15px; text-decoration: none\">公式サイトを見る<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CAUTION ============ -->\n<section style=\"max-width: 1240px; margin: 0 auto; padding: 0 clamp(18px, 4vw, 48px) clamp(64px, 9vw, 120px)\">\n<div class=\"wdf-reveal\" style=\"border: 2px solid #FFB000; border-radius: 22px; padding: clamp(22px, 3vw, 36px); display: flex; flex-wrap: wrap; gap: 20px 48px; align-items: flex-start\">\n<p style=\"margin: 0; flex: 0 0 auto; font-family: 'Anton', sans-serif; font-size: 34px; letter-spacing: 0.06em; color: #FFB000\">SAFETY<br>NOTICE<\u002Fp>\n<ul style=\"flex: 1 1 400px; margin: 0; padding-left: 20px; font-size: 16px; line-height: 2.1; color: #E4E4EA\">\n<li>クルマ通勤の人は、飲むなら乗らない。帰りの足は先に決めとこう<\u002Fli>\n<li>屋外会場。11月の夜の海っぺりは冷えるから、上着は必須<\u002Fli>\n<li
